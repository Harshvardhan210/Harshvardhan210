<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 32px;
      background-color: #0d1117;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    hr {
      height: 0.25em;
      padding: 0;
      margin: 24px 0;
      background-color: #21262d;
      border: 0;
    }

    .grid-stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .grid-stats img {
      height: 165px;
      border-radius: 6px;
    }

    .snake-container {
      text-align: center;
      margin: 20px 0;
    }

    .snake-container img {
      width: 100%;
      max-width: 750px;
      border: 1px solid #3B0764;
      border-radius: 8px;
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #A78BFA;
      margin-top: 25px;
      font-style: italic;
    }
  </style>
</head>
